[project]
name = "automation-engine"
version = "0.1.0"
description = "Motor de ejecucion de recetas con ejecutores intercambiables"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "httpx",
    "playwright",
    "camoufox",
    "loguru",
    "typer",
    "tenacity",
    "anthropic",
    "pypdf",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
engine = "src.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "config*"]
